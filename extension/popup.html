<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>LinkBag</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <div class="brand" aria-label="LinkBag">
        <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true">
          <rect x="5" y="7" width="20" height="18" fill="none" stroke="currentColor" stroke-width="1.8" />
          <path d="M5 12h20" stroke="currentColor" stroke-width="1.8" />
          <path d="M19 7v9l3-2.1 3 2.1V7" fill="#A63B2E" />
          <path d="M10 16h6M10 20h4" stroke="currentColor" stroke-width="1.4" />
        </svg>
        <span>LinkBag</span>
      </div>
      <div class="top-right">
        <span class="status is-cold" id="status">
          <span class="dot" aria-hidden="true"></span>
          <span id="statusText">连接中</span>
        </span>
        <button type="button" class="icon-btn" id="settingsBtn" title="设置" aria-label="设置">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M4 7h10M18 7h2M4 17h2M10 17h10" />
            <rect x="14" y="4.5" width="4" height="5" />
            <rect x="6" y="14.5" width="4" height="5" />
          </svg>
        </button>
      </div>
    </header>

    <div class="searchbar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m15.5 15.5 5 5" />
      </svg>
      <input id="search" type="search" placeholder="搜索收藏" aria-label="搜索收藏" autocomplete="off" spellcheck="false" />
    </div>

    <div class="meta" id="meta">
      <span id="countLabel">正在读取</span>
      <span id="queueLabel"></span>
    </div>

    <main class="scroll" id="list" aria-live="polite"></main>

    <section class="offline" id="offline" hidden>
      <div class="offline-mark" aria-hidden="true">
        <span></span><span></span><span></span>
      </div>
      <p class="kicker">链接服务未响应</p>
      <h1>后台还没有醒来。</h1>
      <p class="offline-copy">启动 LinkBag 服务后，这里会列出你的收藏和每一次快照。</p>
      <code id="serverUrl">http://127.0.0.1:8787</code>
      <div class="offline-actions">
        <button type="button" class="btn btn-primary" id="retryBtn">重新连接</button>
        <button type="button" class="text-btn" id="offlineSettings">更改地址</button>
      </div>
      <p class="offline-hint">在项目目录运行 <code>mise run start</code></p>
    </section>

    <div class="error-bar" id="error" hidden></div>

    <footer class="foot">
      <button type="button" class="foot-link" id="openDashboard">打开控制台</button>
      <span class="foot-server" id="serverLabel"></span>
      <button type="button" class="foot-link" id="footerSettings">设置</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
